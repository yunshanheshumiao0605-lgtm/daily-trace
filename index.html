<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一日有痕</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17191f;
      --muted: #6f7480;
      --soft: #979da8;
      --line: #e2e5ea;
      --paper: #f6f4ee;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --surface-3: #eef2f4;
      --green: #2f765c;
      --blue: #2d5f82;
      --coral: #b65d50;
      --gold: #9d7622;
      --shadow: 0 14px 34px rgba(27, 31, 38, .07);
      --radius: 8px;
      --focus-ring: 0 0 0 3px rgba(45, 95, 130, .18);
      --columns: minmax(390px, .9fr) minmax(0, 1.1fr);
      --gap: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, #fbfaf6 0%, #f6f4ee 54%, #eef3ef 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    input,
    textarea {
      outline: none;
    }

    input:focus-visible,
    textarea:focus-visible,
    button:focus-visible,
    summary:focus-visible {
      box-shadow: var(--focus-ring);
    }

    .app {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr;
      align-items: end;
      gap: var(--gap);
      margin-bottom: 16px;
    }

    .brand {
      display: grid;
      gap: 6px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(34px, 4vw, 52px);
      line-height: 1;
      font-weight: 780;
      letter-spacing: 0;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .date-switcher {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 28px rgba(27, 31, 38, .06);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      font-size: 22px;
      transition: background .14s ease, color .14s ease;
    }

    .icon-btn:hover {
      background: var(--surface-3);
      color: var(--blue);
    }

    #dateInput {
      width: 148px;
      height: 38px;
      border: 0;
      border-inline: 1px solid var(--line);
      border-radius: 0;
      padding: 0 10px;
      color: var(--ink);
      background: transparent;
    }

    .calendar-workbench {
      display: grid;
      grid-template-columns: var(--columns);
      gap: var(--gap);
      align-items: stretch;
      margin-bottom: 14px;
    }

    .calendar-panel,
    .reflection-panel {
      padding: clamp(18px, 2.4vw, 28px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .calendar-panel {
      min-height: 440px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
    }

    .year-toolbar {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 38px;
      align-items: center;
      gap: 12px;
    }

    .year-title {
      display: grid;
      place-items: center;
      gap: 4px;
    }

    .year-title strong {
      font-size: 25px;
      line-height: 1;
      letter-spacing: 0;
    }

    .year-title input {
      width: 144px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: #f5f6f7;
      text-align: center;
      font-size: 13px;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      align-content: start;
      padding: 2px;
    }

    .calendar-weekday {
      color: var(--soft);
      font-size: 13px;
      font-weight: 720;
      text-align: center;
      padding: 4px 0 8px;
    }

    .mini-day {
      position: relative;
      min-height: 56px;
      padding: 7px;
      border: 1px solid #e4e7eb;
      border-radius: 7px;
      background: #fbfcfd;
      color: var(--ink);
      display: grid;
      align-content: space-between;
      text-align: left;
      transition: border-color .14s ease, background .14s ease, transform .14s ease, color .14s ease;
    }

    .mini-day:hover {
      transform: translateY(-1px);
      border-color: rgba(45, 95, 130, .45);
      background: #f5f8fa;
    }

    .mini-day.is-blank {
      visibility: hidden;
    }

    .mini-day.is-today {
      border-color: rgba(47, 118, 92, .55);
      box-shadow: inset 0 0 0 1px rgba(47, 118, 92, .18);
    }

    .mini-day.is-selected {
      color: #fff;
      background: #1f252b;
      border-color: #1f252b;
    }

    .mini-day strong {
      font-size: 16px;
      line-height: 1;
    }

    .mini-day small {
      color: inherit;
      opacity: .68;
      font-size: 11px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-day.has-festival {
      border-color: rgba(182, 93, 80, .32);
      background: #fffaf8;
    }

    .mini-day.has-festival small {
      color: var(--coral);
      opacity: 1;
      font-weight: 720;
    }

    .mini-day.is-selected.has-festival small {
      color: inherit;
    }

    .day-stack {
      display: grid;
      gap: var(--gap);
      grid-template-rows: 1fr;
      align-content: stretch;
      height: 100%;
    }

    .reflection-panel {
      position: relative;
      height: 100%;
      min-height: 440px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      align-content: stretch;
      gap: 12px;
      border-left: 4px solid rgba(45, 95, 130, .32);
    }

    .daily-quote {
      margin: 0;
      color: var(--ink);
      max-width: 40em;
      font-size: 16px;
      line-height: 1.78;
      font-weight: 610;
      letter-spacing: 0;
      text-indent: 2em;
    }

    .quote-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: -4px;
    }

    .quote-sync-btn {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      background: #eef3f6;
      color: var(--blue);
      font-size: 12px;
      font-weight: 760;
    }

    .quote-sync-btn:hover {
      background: #e4edf3;
    }

    .quote-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .section-title,
    .field label {
      font-size: 14px;
      color: var(--muted);
      font-weight: 720;
    }

    .task-grid {
      display: grid;
      grid-template-columns: var(--columns);
      grid-template-areas:
        "must habit"
        "push habit";
      gap: var(--gap);
      align-items: stretch;
      margin-bottom: 14px;
    }

    .task-card.must {
      grid-area: must;
    }

    .task-card.push {
      grid-area: push;
    }

    .task-card.habit {
      grid-area: habit;
    }

    .task-card,
    .review,
    .history {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(27, 31, 38, .06);
    }

    .task-card {
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto auto;
      min-height: 0;
      align-content: start;
    }

    .task-head {
      min-height: 76px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .task-head h2 {
      margin: 0 0 5px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .task-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .tag {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 740;
    }

    .must .tag {
      background: var(--coral);
    }

    .push .tag {
      background: var(--blue);
    }

    .habit .tag {
      background: var(--green);
    }

    .tasks {
      min-height: 0;
      padding: 8px 12px;
    }

    .task {
      display: grid;
      grid-template-columns: 28px 1fr 30px;
      gap: 8px;
      align-items: center;
      min-height: 46px;
      border-bottom: 1px solid #eef0f2;
    }

    .task.habit-task {
      align-items: center;
      min-height: 54px;
      padding: 4px 0;
    }

    .task input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task input[type="text"] {
      width: 100%;
      border: 0;
      min-height: 34px;
      background: transparent;
      color: var(--ink);
      outline: none;
      line-height: 1.3;
    }

    .task input[type="text"]::placeholder,
    textarea::placeholder {
      color: #a0a6ae;
    }

    .task.done input[type="text"] {
      color: #8a929b;
      text-decoration: line-through;
    }

    .habit-fields {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .habit-title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .habit-editor summary {
      min-height: 28px;
      display: inline-grid;
      place-items: center;
      padding: 0 9px;
      border-radius: 6px;
      background: #eef5f0;
      color: var(--green);
      font-size: 12px;
      font-weight: 760;
      cursor: pointer;
      list-style: none;
      white-space: nowrap;
    }

    .habit-editor summary::-webkit-details-marker {
      display: none;
    }

    .habit-detail {
      width: 100%;
      min-height: 52px;
      margin-top: 6px;
      resize: vertical;
      border: 1px solid #e2e7ec;
      border-radius: 7px;
      padding: 8px 10px;
      background: #fbfcfb;
      color: var(--muted);
      line-height: 1.45;
      outline: none;
    }

    .task.done .habit-detail {
      color: #8a929b;
    }

    .month-panel {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 10px;
    }

    .month-stat {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 0;
      border-bottom: 0;
    }

    .month-stat:last-child {
      border-bottom: 0;
    }

    .month-stat-head {
      display: grid;
      gap: 3px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 730;
    }

    .month-stat-head span:last-child {
      color: var(--muted);
      font-weight: 650;
    }

    .day-dots {
      display: grid;
      grid-template-columns: repeat(31, minmax(0, 1fr));
      gap: 1px;
      justify-content: start;
      width: 100%;
    }

    .day-dot {
      width: 100%;
      height: 18px;
      border-radius: 4px;
      background: transparent;
      color: #c4cad1;
      font-size: 15px;
      line-height: 1;
      padding: 0;
      transition: transform .12s ease, color .12s ease, background .12s ease;
    }

    .day-dot:hover {
      transform: translateY(-1px) scale(1.08);
      color: var(--green);
    }

    .day-dot.done {
      color: var(--green);
      background: rgba(47, 118, 92, .08);
      font-weight: 760;
    }

    .day-dot.today {
      outline: 2px solid rgba(47, 125, 87, .24);
      outline-offset: 1px;
    }

    .day-dot.disabled {
      color: #e0e4e8;
      cursor: default;
      opacity: .62;
    }

    .day-dot.disabled:hover {
      transform: none;
      color: #e0e4e8;
    }

    .habit-report-title {
      margin: 2px 0 0;
      color: var(--green);
      font-size: 13px;
      font-weight: 760;
    }

    .delete {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: #8a4b42;
      background: transparent;
      font-size: 18px;
    }

    .delete:hover {
      background: #f7e7e4;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #eef0f2;
      background: #fbfcfd;
    }

    .add-row input {
      min-width: 0;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 11px;
      background: #fff;
    }

    .add-row button {
      height: 40px;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      transition: background .14s ease, transform .14s ease;
    }

    .add-row button:hover {
      background: var(--blue);
      transform: translateY(-1px);
    }

    .bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      align-items: start;
    }

    .review,
    .history {
      padding: 18px;
    }

    .review h2,
    .history h2 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: 0;
    }

    .history-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 14px;
    }

    .history-head h2 {
      margin: 0;
    }

    .history-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .history-scope {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }

    .review-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 6px;
    }

    .review-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .sync-btn {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 13px;
      font-weight: 720;
    }

    .sync-btn:hover {
      background: var(--blue);
    }

    .sync-status {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      text-align: right;
    }

    .review-intro {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 11px;
      line-height: 1.55;
      background: #fff;
    }

    .field.wide textarea {
      min-height: 92px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 430px;
      overflow: auto;
      padding-right: 2px;
    }

    .history-item {
      width: 100%;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 10px;
      background: #fbfcfd;
      border: 1px solid #e6eaee;
      border-radius: 7px;
      color: var(--ink);
      text-align: left;
      transition: background .14s ease, border-color .14s ease, transform .14s ease;
    }

    .history-item:hover {
      transform: translateY(-1px);
      background: #f6f9fb;
      border-color: rgba(45, 95, 130, .32);
    }

    .history-date {
      display: grid;
      place-items: center;
      min-height: 40px;
      border-radius: 6px;
      background: #eef3f6;
    }

    .history-date strong {
      font-size: 18px;
      line-height: 1;
    }

    .history-date small,
    .history-meta small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .history-meta {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .history-meta strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      line-height: 1.25;
    }

    .history-badge {
      color: var(--blue);
      font-size: 12px;
      font-weight: 760;
    }

    .obsidian-preview {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .obsidian-preview[hidden] {
      display: none;
    }

    .obsidian-preview h3 {
      margin: 0;
      font-size: 14px;
      line-height: 1.3;
    }

    .obsidian-preview pre {
      max-height: 260px;
      margin: 0;
      padding: 12px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid #e7eaee;
      border-radius: 7px;
      background: #fbfcfd;
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      line-height: 1.6;
    }

    .obsidian-link {
      width: fit-content;
      color: var(--blue);
      font-size: 12px;
      font-weight: 760;
      text-decoration: none;
    }

    .empty {
      color: var(--muted);
      padding: 10px 0;
      line-height: 1.55;
    }

    @media (max-width: 880px) {
      .topbar,
      .calendar-workbench,
      .bottom {
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
      }

      .date-switcher {
        justify-self: start;
      }

      .task-grid,
      .fields {
        grid-template-columns: 1fr;
      }

      .task-grid {
        grid-template-areas:
          "must"
          "push"
          "habit";
      }

      .month-stat {
        grid-template-columns: 1fr;
      }

      .day-dots {
        justify-content: start;
      }

      .calendar-panel {
        min-height: 0;
      }

      .reflection-panel {
        min-height: 0;
        grid-template-rows: auto auto auto;
      }
    }

    @media (max-width: 520px) {
      .app {
        width: calc(100% - 20px);
        padding-top: 14px;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
      }

      .reflection-panel,
      .calendar-panel,
      .review,
      .history {
        padding: 14px;
      }

      .year-grid {
        gap: 5px;
      }

      .mini-day {
        min-height: 46px;
        padding: 6px;
      }

      .mini-day strong {
        font-size: 14px;
      }

      .mini-day small {
        font-size: 9px;
      }

      .reflection-panel {
        min-height: 0;
      }

      .task-head {
        min-height: 74px;
      }

      .task-card {
        min-height: 0;
      }

      .tasks {
        min-height: 96px;
      }

      .add-row {
        grid-template-columns: minmax(0, 1fr) 40px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>一日有痕</h1>
        <p>苟日新，日日新，又日新。</p>
      </div>
    </header>

    <section class="calendar-workbench" aria-label="日历和今日状态">
      <article class="calendar-panel">
        <div class="year-toolbar" aria-label="切换月份和日期">
          <button class="icon-btn" id="prevDay" title="上个月" aria-label="上个月">‹</button>
          <div class="year-title">
            <strong id="calendarMonth">2026年6月</strong>
            <input id="dateInput" type="date" aria-label="选择日期">
          </div>
          <button class="icon-btn" id="nextDay" title="下个月" aria-label="下个月">›</button>
        </div>
        <div class="year-grid" id="calendarGrid"></div>
      </article>

      <div class="day-stack">
        <article class="reflection-panel" aria-label="每日精选">
          <blockquote class="daily-quote" id="quoteText">今天先做一件小而确定的事。</blockquote>
          <div class="quote-actions">
            <button class="quote-sync-btn" id="syncQuotes" type="button">从 Obsidian 更新每日一句</button>
            <span class="quote-status" id="quoteStatus"></span>
          </div>
          <h2 class="habit-report-title">本月打卡</h2>
          <div class="month-panel" id="habitMonthPanel"></div>
        </article>
      </div>
    </section>

    <section class="task-grid" aria-label="任务清单">
      <article class="task-card must" data-section="must">
        <div class="task-head">
          <div>
            <h2>必须完成</h2>
            <p>最多三件，决定今天是否过关。</p>

    let currentDate = toDateKey(new Date());
    let store = loadStore();
    let obsidianDirHandle = null;
    let obsidianAutoSync = localStorage.getItem("daily-todo-obsidian-auto-sync-v1") === "enabled";
    let obsidianSyncTimer = null;
    let obsidianSyncInFlight = false;
    let obsidianSyncPending = false;
    let customQuotePool = loadQuotePool();
    let quoteFileHandle = null;

    function toDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function fromDateKey(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function loadStore() {
      try {
        return JSON.parse(localStorage.getItem("daily-todo-store-v1")) || {};
      } catch {
        return {};
      }
    }

    function loadQuotePool() {
      try {
        return JSON.parse(localStorage.getItem("daily-trace-quote-pool-v1")) || null;
      } catch {
        return null;
      }
    }

    function saveQuotePool(quotes, sourceName) {
      customQuotePool = {
        quotes,
        sourceName,
        updatedAt: new Date().toISOString()
      };
      localStorage.setItem("daily-trace-quote-pool-v1", JSON.stringify(customQuotePool));
    }

    function openQuoteDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }

        const request = indexedDB.open("daily-trace-settings-v1", 1);
        request.onupgradeneeded = () => {
          request.result.createObjectStore("handles");
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function getSavedQuoteFileHandle() {
      if (quoteFileHandle) return quoteFileHandle;

      try {
        const db = await openQuoteDb();
        quoteFileHandle = await new Promise((resolve, reject) => {
          const request = db.transaction("handles").objectStore("handles").get("quoteSource");
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error);
        });
        db.close();
        return quoteFileHandle;
      } catch {
        return null;
      }
    }

    async function saveQuoteFileHandle(fileHandle) {
      quoteFileHandle = fileHandle;

      try {
        const db = await openQuoteDb();
        await new Promise((resolve, reject) => {
          const request = db.transaction("handles", "readwrite").objectStore("handles").put(fileHandle, "quoteSource");
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
        db.close();
      } catch {
        // The imported quote pool still works even if the browser cannot remember the file handle.
      }
    }

    function saveStore() {
      localStorage.setItem("daily-todo-store-v1", JSON.stringify(store));
    }

    function normalizeTask(task) {
      return {
        id: task.id || crypto.randomUUID(),
        text: task.text || "",
        detail: task.detail || "",
        done: Boolean(task.done)
      };
    }

    function latestHabitTemplate(beforeKey) {
      const previousKey = Object.keys(store)
        .filter(key => key < beforeKey && Array.isArray(store[key]?.habit) && store[key].habit.length)
        .sort()
        .pop();
      if (!previousKey) {
        return [
          { id: crypto.randomUUID(), text: "学英语", detail: "今天学什么、复习什么、输入了什么材料。", done: false },
          { id: crypto.randomUUID(), text: "运动", detail: "运动类型、时长、强度或身体状态。", done: false },
          { id: crypto.randomUUID(), text: "阅读", detail: "书名、章节、文章或关键收获。", done: false },
          { id: crypto.randomUUID(), text: "复盘", detail: "今天做得好的地方、卡点和明天第一步。", done: false }
        ];
      }
      return store[previousKey].habit.map(task => ({
        id: task.id || crypto.randomUUID(),
        text: task.text || "",
        detail: task.detail || "",
        done: false
      }));
    }

    function blankDay(key) {
      return {
        must: [],
        push: [],
        habit: latestHabitTemplate(key),
        planText: "",
        doneText: "",
        blockedText: "",
        lessonText: "",
        tomorrowText: ""
      };
    }

    function getDay(key = currentDate) {
      if (!store[key]) {
        store[key] = blankDay(key);
        saveStore();
      }
      if (!Array.isArray(store[key].must) && (Array.isArray(store[key].workMust) || Array.isArray(store[key].lifeMust))) {
        store[key].must = [...(store[key].workMust || []), ...(store[key].lifeMust || [])];
      }
      sections.forEach(section => {
        store[key][section] = (store[key][section] || []).map(normalizeTask);
      });
      return store[key];
    }

    function render() {
      const day = getDay();
      dateInput.value = currentDate;
      renderDateLabel();
      sections.forEach(section => renderTasks(section, day[section]));
      fields.forEach(id => {
        document.getElementById(id).value = day[id] || "";
      });
      renderProgress(day);
      renderCalendar();
      renderQuote();
      renderHistory();
      renderHabitMonth();
      updateObsidianSyncUi();
      updateQuoteSyncUi();
    }

    function renderDateLabel() {
      const date = fromDateKey(currentDate);
      const monthFormatter = new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "long"
      });
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      calendarMonth.textContent = monthFormatter.format(date);
    }

    function renderQuote() {
      const date = fromDateKey(currentDate);
      const start = new Date(date.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((date - start) / 86400000);
      const quotes = customQuotePool?.quotes?.length ? customQuotePool.quotes : dailySelections;
      const selection = quotes[(dayOfYear - 1) % quotes.length];
      quoteText.textContent = selection;
    }

    function updateQuoteSyncUi() {
      if (!customQuotePool?.quotes?.length) {
        quoteStatus.textContent = "使用内置句子库";
        return;
      }

      const updatedAt = new Date(customQuotePool.updatedAt);
      const dateLabel = Number.isNaN(updatedAt.getTime())
        ? ""
        : new Intl.DateTimeFormat("zh-CN", {
          month: "numeric",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).format(updatedAt);
      quoteStatus.textContent = `已载入 ${customQuotePool.quotes.length} 句${dateLabel ? ` · ${dateLabel}` : ""}`;
    }

    function cleanQuoteLine(line) {
      return line
        .replace(/^#{1,6}\s*/, "")
        .replace(/^[-*+]\s+/, "")
        .replace(/^\d+[.)、]\s*/, "")
        .replace(/^>\s*/, "")
        .replace(/\[\[|\]\]/g, "")
        .replace(/\*\*|__/g, "")
        .trim();
    }

    function extractQuotesFromMarkdown(markdown) {
      return markdown
        .split(/\n{1,}/)
        .map(cleanQuoteLine)
        .filter(line => line.length >= 18)
        .filter(line => !/^---+$/.test(line))
        .filter(line => !/^!\[/.test(line))
        .filter(line => !/^https?:\/\//.test(line))
        .slice(0, 365);
    }

    async function importQuotesFromFileHandle(fileHandle, options = { requestPermission: true }) {
      if (options.requestPermission && fileHandle.queryPermission && fileHandle.requestPermission) {
        let permission = await fileHandle.queryPermission({ mode: "read" });
        if (permission !== "granted") {
          permission = await fileHandle.requestPermission({ mode: "read" });
        }
        if (permission !== "granted") {
          quoteStatus.textContent = "需要重新授权后才能读取最新句子";
          return false;
        }
      }

      const file = await fileHandle.getFile();
      const markdown = await file.text();
      const quotes = extractQuotesFromMarkdown(markdown);

      if (!quotes.length) {
        quoteStatus.textContent = "没有提取到可用句子";
        return false;
      }

      saveQuotePool(quotes, file.name);
      await saveQuoteFileHandle(fileHandle);
      renderQuote();
      updateQuoteSyncUi();
      return true;
    }

    async function autoRefreshQuotesFromObsidian() {
      const fileHandle = await getSavedQuoteFileHandle();
      if (!fileHandle) return;

      try {
        const permission = fileHandle.queryPermission
          ? await fileHandle.queryPermission({ mode: "read" })
          : "granted";
        if (permission !== "granted") {
          quoteStatus.textContent = "句子来源已记住，点击按钮重新授权更新";
          return;
        }
        await importQuotesFromFileHandle(fileHandle, { requestPermission: false });
      } catch {
        quoteStatus.textContent = "自动更新失败，点击按钮重新选择";
      }
    }

    async function syncQuotesFromObsidian() {
      if (!window.showOpenFilePicker) {
        quoteStatus.textContent = "当前浏览器不支持读取本地 Markdown";
        return;
      }

      try {
        quoteStatus.textContent = "请选择《改变你想法的101篇文章》Markdown 文件";
        const [fileHandle] = await window.showOpenFilePicker({
          id: "daily-trace-quotes",
          multiple: false,
          types: [{
            description: "Markdown",
            accept: {
              "text/markdown": [".md", ".markdown"],
              "text/plain": [".txt"]
            }
          }]
        });
        await importQuotesFromFileHandle(fileHandle);
      } catch (error) {
        quoteStatus.textContent = error.name === "AbortError" ? "已取消更新" : "读取失败，请重新选择";
      }
    }

    function taskCompletionFor(key) {
      const day = store[key];
      if (!day) return { total: 0, done: 0 };
      const tasks = sections.flatMap(section => day[section] || []);
      return {
        total: tasks.length,
        done: tasks.filter(task => task.done).length
      };
    }

    function renderCalendar() {
      const selected = fromDateKey(currentDate);
      const todayKey = toDateKey(new Date());
      const year = selected.getFullYear();
      const month = selected.getMonth();
      calendarGrid.innerHTML = "";

      weekdayShort.forEach(day => {
        const label = document.createElement("span");
        label.className = "calendar-weekday";
        label.textContent = day;
        calendarGrid.appendChild(label);
      });

      const first = new Date(year, month, 1);
      const offset = (first.getDay() + 6) % 7;
      const monthDays = new Date(year, month + 1, 0).getDate();

      for (let blank = 0; blank < offset; blank += 1) {
        const spacer = document.createElement("span");
        spacer.className = "mini-day is-blank";
        calendarGrid.appendChild(spacer);
      }

      for (let dayNumber = 1; dayNumber <= monthDays; dayNumber += 1) {
        const date = new Date(year, month, dayNumber);
        const key = toDateKey(date);
        const completion = taskCompletionFor(key);
        const festival = traditionalFestivals[key];
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "mini-day",
          key === todayKey ? "is-today" : "",
          key === currentDate ? "is-selected" : "",
          festival ? "has-festival" : ""
        ].filter(Boolean).join(" ");
        button.setAttribute("aria-label", `选择 ${key}${festival ? ` ${festival}` : ""}`);

        const number = document.createElement("strong");
        number.textContent = dayNumber;
        const meta = document.createElement("small");
        meta.textContent = festival || (completion.total ? `${completion.done}/${completion.total}项` : " ");
        button.append(number, meta);

        button.addEventListener("click", () => {
          currentDate = key;
          render();
        });
        calendarGrid.appendChild(button);
      }
    }

    function renderTasks(section, tasks) {
      const host = taskHosts[section];
      host.innerHTML = "";
      if (!tasks.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = section === "must" ? "今天的重点还没写。" : "这里还没有事项。";
        host.appendChild(empty);
        return;
      }

      tasks.forEach(task => {
        const row = document.createElement("div");
        row.className = `task${section === "habit" ? " habit-task" : ""}${task.done ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          persistAndRender();
        });

        const input = document.createElement("input");
        input.type = "text";
        input.value = task.text;
        input.placeholder = section === "habit" ? "习惯标题" : "写下事项";
        input.addEventListener("input", () => {
          task.text = input.value;
          saveStore();
          renderProgress(getDay());
          renderHistory();
          if (section === "habit") renderHabitMonth();
          scheduleObsidianSync();
        });

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.type = "button";
        remove.title = "删除";
        remove.setAttribute("aria-label", "删除");
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          const day = getDay();
          day[section] = day[section].filter(item => item.id !== task.id);
          persistAndRender();
        });

        if (section === "habit") {
          const fieldsWrap = document.createElement("div");
          fieldsWrap.className = "habit-fields";

          const titleRow = document.createElement("div");
          titleRow.className = "habit-title-row";

          const detail = document.createElement("textarea");
          detail.className = "habit-detail";
          detail.value = task.detail || "";
          detail.placeholder = "写详细内容，方便之后查看或编辑";
          detail.addEventListener("input", () => {
            task.detail = detail.value;
            saveStore();
            scheduleObsidianSync();
          });

          const editor = document.createElement("details");
          editor.className = "habit-editor";
          const summary = document.createElement("summary");
          summary.textContent = "编辑";
          editor.append(summary, detail);

          titleRow.append(input, editor);
          fieldsWrap.append(titleRow);
          row.append(checkbox, fieldsWrap, remove);
        } else {
          row.append(checkbox, input, remove);
        }
        host.appendChild(row);
      });
    }

    function daysInMonth(dateKey) {
      const date = fromDateKey(dateKey);
      return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
    }

    function toggleHabitForDate(dateKey, habit) {
      const targetDay = getDay(dateKey);
      let matched = targetDay.habit.find(item => item.id === habit.id || item.text === habit.text);

      if (!matched) {
        matched = normalizeTask({
          ...habit,
          id: habit.id || crypto.randomUUID(),
          done: false
        });
        targetDay.habit.push(matched);
      }

      matched.done = !matched.done;
      saveStore();
      render();
      scheduleObsidianSync(dateKey);
    }

    function renderHabitMonth() {
      const monthKey = currentDate.slice(0, 7);
      const day = getDay();
      const habits = day.habit || [];
      habitMonthPanel.innerHTML = "";

      if (!habits.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "添加习惯后，这里会显示本月每天的打卡情况。";
        habitMonthPanel.appendChild(empty);
        return;
      }

      habits.forEach(habit => {
        const stat = document.createElement("div");
        stat.className = "month-stat";

        const monthDays = daysInMonth(currentDate);
        let doneCount = 0;
        const dots = document.createElement("div");
        dots.className = "day-dots";

        for (let dayNumber = 1; dayNumber <= 31; dayNumber += 1) {
          const isValidDay = dayNumber <= monthDays;
          const key = `${monthKey}-${String(dayNumber).padStart(2, "0")}`;
          const matched = isValidDay
            ? store[key]?.habit?.find(item => item.id === habit.id || item.text === habit.text)
            : null;
          const isDone = Boolean(matched?.done);
          if (isDone) doneCount += 1;

          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = [
            "day-dot",
            isDone ? "done" : "",
            key === currentDate ? "today" : "",
            isValidDay ? "" : "disabled"
          ].filter(Boolean).join(" ");
          dot.textContent = isDone ? "★" : "☆";
          dot.disabled = !isValidDay;
          dot.title = isValidDay
            ? `${key} ${habit.text || "习惯"}：${isDone ? "已打卡" : "未打卡"}`
            : "这个月份没有这一天";
          if (isValidDay) {
            dot.addEventListener("click", () => {
              toggleHabitForDate(key, habit);
            });
          }
          dots.appendChild(dot);
        }

        const head = document.createElement("div");
        head.className = "month-stat-head";
        head.innerHTML = `<span>${habit.text || "未命名习惯"}</span><span>${doneCount} / ${monthDays} 天</span>`;

        stat.append(head, dots);
        habitMonthPanel.appendChild(stat);
      });
    }

    function renderProgress(day) {
      const addPlaceholders = {
        must: "添加必须完成的事",
        push: "添加可以推进的事",
        habit: "添加每日习惯标题"
      };
      sections.forEach(section => {
        const tasks = day[section] || [];
        const total = tasks.length;
        const done = tasks.filter(task => task.done).length;
        taskCounters[section].textContent = section === "must"
          ? `${total}/3项`
          : total ? `${done}/${total}项` : "0项";
      });
      document.querySelectorAll(".add-row").forEach(form => {
        const section = form.dataset.add;
        const input = form.querySelector("input");
        const button = form.querySelector("button");
        const isFull = section === "must" && (day[section] || []).length >= 3;
        input.disabled = isFull;
        button.disabled = isFull;
        input.placeholder = isFull ? "已写满 3 件" : addPlaceholders[section];
      });
    }

    function hasRecord(day) {
      const plannedTasks = planningSections.some(section =>
        (day[section] || []).some(task => task.text?.trim() || task.detail?.trim() || task.done)
      );
      const habitDone = (day.habit || []).some(task => task.done);
      const reviewText = fields.some(id => day[id]?.trim());
      return plannedTasks || habitDone || reviewText;
    }

    function recordPreview(day) {
      const firstTask = [...(day.must || []), ...(day.push || [])]
        .find(task => task.text?.trim())?.text.trim();
      const firstReview = fields.map(id => day[id]?.trim()).find(Boolean);
      if (firstTask) return firstTask;
      if (firstReview) return firstReview;
      if ((day.habit || []).some(task => task.done)) return "完成了习惯打卡";
      return "有记录";
    }

    function renderHistory() {
      const keys = Object.keys(store)
        .filter(key => hasRecord(store[key] || {}))
        .sort()
        .reverse()
        .slice(0, 30);
      historyList.innerHTML = "";
      if (!keys.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "开始写任务或复盘后，这里会显示历史记录。";
        historyList.appendChild(empty);
        return;
      }

      keys.forEach(key => {
        const day = store[key];
        const date = fromDateKey(key);
        const tasks = sections.flatMap(section => day[section] || []);
        const total = tasks.length;
        const done = tasks.filter(task => task.done).length;
        const month = date.getMonth() + 1;
        const dayNumber = date.getDate();
        const weekday = new Intl.DateTimeFormat("zh-CN", { weekday: "short" }).format(date);
        const hasReview = fields.some(id => day[id]?.trim());
        const item = document.createElement("button");
        item.type = "button";
        item.className = "history-item";
        item.setAttribute("aria-label", `查看 ${key} 的记录`);

        const dateBlock = document.createElement("div");
        dateBlock.className = "history-date";
        dateBlock.innerHTML = `<strong>${dayNumber}</strong><small>${month}月</small>`;

        const meta = document.createElement("div");
        meta.className = "history-meta";
        meta.innerHTML = `<strong>${recordPreview(day)}</strong><small>${key} · ${weekday} · ${done}/${total} 项${hasReview ? " · 已复盘" : ""}</small>`;

        const badge = document.createElement("span");
        badge.className = "history-badge";
        badge.textContent = "查看";

        item.addEventListener("click", () => {
          currentDate = key;
          render();
          loadObsidianNote(key);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        item.append(dateBlock, meta, badge);
        historyList.appendChild(item);
      });
    }

    function persistAndRender() {
      saveStore();
      render();
      scheduleObsidianSync();
    }

    function markdownList(title, tasks) {
      const lines = [`## ${title}`];
      if (!tasks.length) {
        lines.push("- 未填写");
        return lines.join("\n");
      }
      tasks.forEach(task => {
        const checked = task.done ? "x" : " ";
        const text = task.text.trim() || "未命名";
        lines.push(`- [${checked}] ${text}`);
        if (task.detail?.trim()) lines.push(`  - ${task.detail.trim()}`);
      });
      return lines.join("\n");
    }

    function buildReviewMarkdown(dateKey = currentDate) {
      const day = getDay(dateKey);
      const date = fromDateKey(dateKey);
      const weekday = new Intl.DateTimeFormat("zh-CN", { weekday: "long" }).format(date);
      const tasks = sections.flatMap(section => day[section] || []);
      const done = tasks.filter(task => task.done).length;
      const total = tasks.length;

      return [
        `# 每日复盘 ${dateKey}`,
        "",
        `- 日期：${dateKey} ${weekday}`,
        `- 完成进度：${done} / ${total}`,
        "",
        markdownList("必须完成", day.must || []),
        "",
        markdownList("可以推进", day.push || []),
        "",
        markdownList("习惯打卡", day.habit || []),
        "",
        "## AAR 轻量复盘",
        "",
        "### 原计划",
        day.planText?.trim() || "未填写",
        "",
        "### 实际结果",
        day.doneText?.trim() || "未填写",
        "",
        "### 差距原因",
        day.blockedText?.trim() || "未填写",
        "",
        "### 学到什么",
        day.lessonText?.trim() || "未填写",
        "",
        "### 明日实验",
        day.tomorrowText?.trim() || "未填写",
        ""
      ].join("\n");
    }

    function downloadMarkdown(filename, content) {
      const blob = new Blob([content], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    async function getObsidianReviewDir(options = { create: true }) {
      if (obsidianDirHandle) return obsidianDirHandle;
      const root = await window.showDirectoryPicker({ id: "obsidian-vault", mode: "readwrite" });
      obsidianDirHandle = root.name === "每日复盘"
        ? root
        : await root.getDirectoryHandle("每日复盘", { create: options.create });
      return obsidianDirHandle;
    }

    function setObsidianPreview(title, body, dateKey = currentDate) {
      obsidianPreview.hidden = false;
      obsidianPreviewTitle.textContent = title;
      obsidianPreviewBody.textContent = body;
      obsidianOpenLink.href = `obsidian://open?vault=${encodeURIComponent("Obsidian Vault")}&file=${encodeURIComponent(`每日复盘/${dateKey}.md`)}`;
    }

    async function loadObsidianNote(dateKey) {
      const filename = `${dateKey}.md`;

      if (!window.showDirectoryPicker) {
        setObsidianPreview("Obsidian 回看不可用", "当前浏览器不支持直接读取本地文件夹。你可以在 Obsidian 里打开“每日复盘”文件夹查看。", dateKey);
        return;
      }

      setObsidianPreview("正在读取 Obsidian...", "如果是第一次回看，请选择 Obsidian Vault 或“每日复盘”文件夹。", dateKey);

      try {
        const dirHandle = await getObsidianReviewDir({ create: false });
        const fileHandle = await dirHandle.getFileHandle(filename);
        const file = await fileHandle.getFile();
        const content = await file.text();
        setObsidianPreview(`Obsidian 回看 · ${dateKey}`, content || "这篇笔记是空的。", dateKey);
      } catch (error) {
        if (error.name === "AbortError") {
          setObsidianPreview("已取消读取", "你取消了文件夹选择。下次点击历史记录时可以重新授权。", dateKey);
        } else if (error.name === "NotFoundError") {
          setObsidianPreview(`未找到 ${filename}`, "Obsidian 的“每日复盘”文件夹里还没有这一天的 Markdown。先同步一次当天复盘后，就能在这里回看。", dateKey);
        } else {
          setObsidianPreview("读取失败", "浏览器没有拿到 Obsidian 文件夹权限，或本地文件暂时无法读取。", dateKey);
        }
      }
    }

    function updateObsidianSyncUi() {
      if (obsidianAutoSync) {
        syncObsidian.textContent = obsidianDirHandle ? "Obsidian 自动同步已开启" : "重新授权 Obsidian 自动同步";
        if (!syncStatus.textContent || syncStatus.textContent === "首次点击后选择 Vault") {
          syncStatus.textContent = obsidianDirHandle ? "修改后会自动同步" : "刷新后需重新选择文件夹";
        }
      } else {
        syncObsidian.textContent = "开启 Obsidian 自动同步";
        syncStatus.textContent = "首次点击后选择 Vault";
      }
    }

    function scheduleObsidianSync(dateKey = currentDate) {
      if (!obsidianAutoSync || !obsidianDirHandle) return;
      clearTimeout(obsidianSyncTimer);
      obsidianSyncTimer = setTimeout(() => {
        syncToObsidian({ automatic: true, dateKey });
      }, 900);
    }

    async function syncToObsidian(options = { automatic: false, dateKey: currentDate }) {
      if (obsidianSyncInFlight) {
        obsidianSyncPending = true;
        return;
      }

      const dateKey = options.dateKey || currentDate;
      const filename = `${dateKey}.md`;
      const content = buildReviewMarkdown(dateKey);

      if (!window.showDirectoryPicker) {
        downloadMarkdown(filename, content);
        syncStatus.textContent = "浏览器不支持直写，已下载 Markdown";
        return;
      }

      obsidianSyncInFlight = true;
      syncStatus.textContent = options.automatic ? "正在自动同步..." : "正在同步...";

      try {
        const dirHandle = await getObsidianReviewDir({ create: true });
        const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(content);
        await writable.close();
        obsidianAutoSync = true;
        localStorage.setItem("daily-todo-obsidian-auto-sync-v1", "enabled");
        syncStatus.textContent = `已同步：每日复盘/${filename}`;
        updateObsidianSyncUi();
      } catch (error) {
        if (error.name === "AbortError") {
          syncStatus.textContent = "已取消选择文件夹";
        } else {
          if (!options.automatic) downloadMarkdown(filename, content);
          syncStatus.textContent = options.automatic ? "自动同步失败，请重新授权" : "写入失败，已下载 Markdown";
        }
      } finally {
        obsidianSyncInFlight = false;
        if (obsidianSyncPending) {
          obsidianSyncPending = false;
          scheduleObsidianSync();
        }
      }
    }

    document.querySelectorAll(".add-row").forEach(form => {
      form.addEventListener("submit", event => {
        event.preventDefault();
        const section = form.dataset.add;
        const input = form.querySelector("input");
        if (section === "must" && (getDay()[section] || []).length >= 3) return;
        const text = input.value.trim();
        if (!text) return;
        getDay()[section].push({ id: crypto.randomUUID(), text, detail: "", done: false });
        input.value = "";
        persistAndRender();
      });
    });

    fields.forEach(id => {
      document.getElementById(id).addEventListener("input", event => {
        getDay()[id] = event.target.value;
        saveStore();
        renderHistory();
        scheduleObsidianSync();
      });
    });

    syncObsidian.addEventListener("click", syncToObsidian);
    syncQuotes.addEventListener("click", syncQuotesFromObsidian);

    dateInput.addEventListener("change", event => {
      currentDate = event.target.value || toDateKey(new Date());
      render();
    });

    function moveMonth(delta) {
      const date = fromDateKey(currentDate);
      const originalDay = date.getDate();
      date.setDate(1);
      date.setMonth(date.getMonth() + delta);
      const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      date.setDate(Math.min(originalDay, lastDay));
      currentDate = toDateKey(date);
      render();
    }

    document.getElementById("prevDay").addEventListener("click", () => {
      moveMonth(-1);
    });

    document.getElementById("nextDay").addEventListener("click", () => {
      moveMonth(1);
    });

    render();
    autoRefreshQuotesFromObsidian();
  </script>
</body>
</html>
